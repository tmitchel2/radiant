name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS on Apple silicon: the platform Radiant is built for first, and the one whose native
    # integration (Metal, Cocoa) the host code exercises.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MSBUILDDISABLENODEREUSE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/Radiant.slnx -c Release -p:UseSharedCompilation=false

      # GPU tests (TestCategory "Gpu") render through a headless Metal device. A runner without a
      # usable adapter reports them inconclusive rather than failing the build.
      - name: Test
        run: >
          dotnet test src/Radiant.slnx -c Release --no-build
          --settings src/settings.runsettings
          --filter "TestCategory!=Integration"
          --results-directory TestResults

      # Test logs, plus the expected/actual/diff images a failed golden-image test writes.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            src/**/TestResults/
          if-no-files-found: ignore
